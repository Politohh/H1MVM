name: Offline regression checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theater:
    name: Theater and library checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Generate projects
        run: tools/premake5 vs2022
      - name: Build Lua for UI fixtures
        run: msbuild build/lua.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=x64
      - name: Library checks
        shell: cmd
        run: tests\test-theater-library.cmd
      - name: Theater and startup checks
        shell: cmd
        run: tests\test-native-theater.cmd

# Full single-EXE builds require original, hash-verified runtime inputs which
# are not hosted here. See docs/single-file-release.md for the release recipe.
# This workflow never deploys upstream files or publishes unverified binaries.
